name: CI

# Runs on every push to main and on pull requests. main is branch-protected
# to require the ci-status check before a PR can merge. Direct pushes to
# main still bypass that (unchanged workflow) — see CI_CD.md for the
# remaining manual steps to make Render/Vercel deploys themselves wait on
# this workflow instead of firing on every push regardless of result.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haylingua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      # Fast fail: a syntax error anywhere in backend/*.py should stop the
      # build in seconds, before spending time booting Postgres/pytest.
      # This is exactly the class of bug (a stray smart quote) that shipped
      # to production undetected before this workflow existed.
      - name: Syntax check (py_compile)
        run: python -m py_compile backend/*.py

      - name: Run backend test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haylingua_test
          EMAIL_CODE_PEPPER: ci-test-pepper-not-a-real-secret
          JWT_SECRET_KEY: ci-test-jwt-secret-not-a-real-secret
          CRON_SECRET: ci-test-cron-secret
        run: pytest backend/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Reports whether the two gates above passed. On push to main, also fires
  # the Render/Vercel deploy hooks — but ONLY once RENDER_DEPLOY_HOOK_URL and
  # VERCEL_DEPLOY_HOOK_URL secrets exist AND auto-deploy-on-push is turned
  # off in both dashboards (see CI_CD.md). Until then this step is a no-op:
  # empty secrets mean the curl calls are skipped, so nothing changes on a
  # repo that hasn't done that manual setup yet.
  ci-status:
    if: always()
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check gate results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "One or more gates failed."
            exit 1
          fi
          echo "All gates passed."

      - name: Trigger deploys (only once hooks are configured)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] && [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "No deploy hook secrets configured yet — see CI_CD.md. Skipping (Render/Vercel auto-deploy-on-push still controls deploys)."
            exit 0
          fi
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deploy..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Vercel deploy..."
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
