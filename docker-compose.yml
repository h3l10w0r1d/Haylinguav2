# docker-compose.yml — local full-stack environment for development and
# pre-launch testing. NOT used in production: Render deploys backend/Dockerfile
# directly (see DOCKER.md), and the frontend deploys via Vercel's own build
# pipeline (vercel.json). db here is a disposable local Postgres — it has no
# relation to the real managed database and is never used by production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haylingua
    ports:
      - "5434:5432"
    volumes:
      - haylingua_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/haylingua
      # Dev-only placeholders — never use these values anywhere real.
      EMAIL_CODE_PEPPER: local-dev-pepper-not-a-real-secret
      JWT_SECRET_KEY: local-dev-jwt-secret-not-a-real-secret
      CRON_SECRET: local-dev-cron-secret
      DISABLE_RATE_LIMIT: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  haylingua_db_data:
