    <!-- Apply the saved theme BEFORE first paint so there's no flash of the
         wrong theme. Default is always light — deliberately ignores
         prefers-color-scheme so first-time visitors land on the brand's
         intended look. Mirrors src/lib/theme.js. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("hay_theme") === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Warm up the API + font connections early to cut first-request latency.
         Kept to the origins the FIRST paint actually needs — the dotLottie
         streak flame (unpkg/lottie.host) only renders deep in the dashboard,
         so it uses dns-prefetch (cheap hint) instead of a full preconnect
         (DNS+TCP+TLS handshake); more than ~4 preconnects on one page starts
         costing more than it saves. -->
    <link rel="preconnect" href="https://haylinguav2.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://haylinguav2.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://lottie.host" />

    <!-- Fonts: discovered by the HTML preload scanner immediately (in
         parallel with the CSS/JS bundles) instead of hiding behind a CSS
         @import, which would only be found after the main stylesheet
         downloads and parses — an extra serial round-trip on the critical
         path. media="print" + onload swap keeps this non-render-blocking;
         first paint uses the system-font fallback (font-display=swap in
         the URL) and swaps in Baloo 2 / Nunito once they arrive.

         Noto Sans Arabic and Noto Sans Georgian are deliberately NOT here —
         they were costing every visitor (English, Russian, French, Spanish —
         5 of 7 locales) 10 extra font-weight downloads for a script that
         never appears on their page. src/lib/LocaleLayout.jsx injects those
         two on demand, only for /ar and /ka routes. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+Armenian:wght@400;600;700;800;900&family=Noto+Sans:wght@400;600;700;800;900&display=swap"

<!-- Umami: only load on the real production domain — without this, every

      s.setAttribute("data-website-id", ids);
      document.head.appendChild(s);
    });
  })();
</script>

<!-- GTM (web container): consent-gated, hard gate — never injected until the
     visitor has explicitly accepted via src/ConsentBanner.jsx, which writes
     localStorage["hay_consent"] = "accepted" and calls
     window.__loadGTMIfConsented() to start it immediately without a reload.
     No Consent Mode ping-then-adjust here on purpose — see the marketing
     integration plan: a script that's simply never loaded pre-consent is a
     strictly stronger privacy posture than one that loads and queues. -->
<script>
  (function () {
    function loadGTM() {
      if (window.__gtmLoaded) return;
      window.__gtmLoaded = true;
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
      var containerId = "%VITE_GTM_CONTAINER_ID%";
      // Vite leaves the literal "%VAR%" in place if the env var is unset
      // (rather than an empty string) — guard both cases so this safely
      // no-ops until a real container id is configured.
      if (!containerId || containerId.charAt(0) === "%") return;
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtm.js?id=" + containerId;
      document.head.appendChild(s);
    }
    try {
      if (localStorage.getItem("hay_consent") === "accepted") loadGTM();
    } catch (e) {}
    window.__loadGTMIfConsented = loadGTM;
  })();
</script>
