<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haylingua — Learn Armenian with modern, gamified lessons</title>
    <meta name="description" content="Haylingua helps you learn Armenian with bite‑sized lessons, listening practice, and gamified progress tracking. Start free — log in or sign up in seconds." />
    <meta name="keywords" content="learn Armenian, Armenian language app, Armenian alphabet, Armenian pronunciation, Armenian lessons, Haylingua" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#f97316" />

    <!-- Apply the saved theme BEFORE first paint so there's no flash of the
         wrong theme. Default is always light — deliberately ignores
         prefers-color-scheme so first-time visitors land on the brand's
         intended look. Mirrors src/lib/theme.js. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("hay_theme") === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Warm up the API + font connections early to cut first-request latency.
         Kept to the origins the FIRST paint actually needs — the dotLottie
         streak flame (unpkg/lottie.host) only renders deep in the dashboard,
         so it uses dns-prefetch (cheap hint) instead of a full preconnect
         (DNS+TCP+TLS handshake); more than ~4 preconnects on one page starts
         costing more than it saves. -->
    <link rel="preconnect" href="https://haylinguav2.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://haylinguav2.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://lottie.host" />

    <!-- Fonts: discovered by the HTML preload scanner immediately (in
         parallel with the CSS/JS bundles) instead of hiding behind a CSS
         @import, which would only be found after the main stylesheet
         downloads and parses — an extra serial round-trip on the critical
         path. media="print" + onload swap keeps this non-render-blocking;
         first paint uses the system-font fallback (font-display=swap in
         the URL) and swaps in Baloo 2 / Nunito once they arrive. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
      />
    </noscript>

    <!-- Canonical + OG/Twitter all point at www — the domain the site actually
         redirects to (haylingua.am -> www.haylingua.am). Mismatched canonical
         vs. actual served domain splits ranking signals between two URLs. -->
    <link rel="canonical" href="https://www.haylingua.am/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Haylingua" />
    <meta property="og:title" content="Haylingua — Learn Armenian with modern, gamified lessons" />
    <meta property="og:description" content="Bite‑sized Armenian lessons with listening, typing, and progress tracking. Start free." />
    <meta property="og:url" content="https://www.haylingua.am/" />
    <meta property="og:image" content="https://www.haylingua.am/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Haylingua — Learn Armenian" />
    <meta name="twitter:description" content="Bite‑sized Armenian lessons with listening, typing, and progress tracking. Start free." />
    <meta name="twitter:image" content="https://www.haylingua.am/og.png" />
    <link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script
  defer
  src="https://analytics.haylingua.am/script.js"
  data-website-id="805c891c-79e8-474e-8414-668887e66554">
</script>
<script defer src="https://analytics.haylingua.am/recorder.js" data-website-id="805c891c-79e8-474e-8414-668887e66554"></script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Haylingua",
        "url": "https://www.haylingua.am/",
        "description": "Learn Armenian with bite-sized lessons, listening practice, and gamified progress tracking.",
        "applicationCategory": "EducationApplication",
        "operatingSystem": "Web, iOS, Android",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": { "@type": "Organization", "name": "Haylingua" }
      }
    </script>

    <!-- Structured data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Haylingua free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — you can create an account and start learning the Armenian alphabet and your first lessons for free."
            }
          },
          {
            "@type": "Question",
            "name": "I don't know the Armenian alphabet at all. Is that okay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Perfect, that's exactly where we begin. The first lessons introduce each letter with its sound, examples, and typing practice before you ever build a word."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a special keyboard?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Exercises are tap-and-choose or use on-screen prompts, and typing exercises accept the Armenian letters shown to you."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work on my phone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Haylingua is built mobile-first and works in any modern browser on phone, tablet, or desktop."
            }
          },
          {
            "@type": "Question",
            "name": "How do streaks and hearts work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You earn XP for correct answers and keep a daily streak by practicing each day. Hearts give you a few tries per session so mistakes feel low-stakes."
            }
          }
        ]
      }
    </script>



<!-- Microsoft Clarity -->
<!-- Deferred like the Brevo widget below: session recording doesn't need to
     start at the very first millisecond, and loading it eagerly means its
     ~25KB script competes with hero content for bandwidth during the LCP
     window on slow connections. Idle (or first interaction) is soon enough. -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        function loadClarity() {
            if (loadClarity._done) return;
            loadClarity._done = true;
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        }
        var events = ['scroll', 'mousemove', 'keydown', 'touchstart', 'click'];
        events.forEach(function(evt) {
            window.addEventListener(evt, loadClarity, { once: true, passive: true });
        });
        var idle = window.requestIdleCallback || function(fn) { setTimeout(fn, 3000); };
        window.addEventListener('load', function() { idle(loadClarity, { timeout: 6000 }); });
    })(window, document, "clarity", "script", "xjq5hmtyh2");
</script>

<!-- Brevo Conversations {literal} -->
<!-- Deferred: the chat widget isn't needed for first paint, and loading it
     eagerly competes with hero content for bandwidth/main-thread during the
     LCP window. Load it once the browser is idle (or on first real user
     interaction, whichever comes first) so it never delays the content that
     actually converts visitors. -->
<script>
    (function(d, w, c) {
        w.BrevoConversationsID = '6983a46e95a3705c2c0beec8';
        w[c] = w[c] || function() {
            (w[c].q = w[c].q || []).push(arguments);
        };
        function loadWidget() {
            if (loadWidget._done) return;
            loadWidget._done = true;
            var s = d.createElement('script');
            s.async = true;
            s.src = 'https://conversations-widget.brevo.com/brevo-conversations.js';
            if (d.head) d.head.appendChild(s);
        }
        var events = ['scroll', 'mousemove', 'keydown', 'touchstart', 'click'];
        events.forEach(function(evt) {
            w.addEventListener(evt, loadWidget, { once: true, passive: true });
        });
        var idle = w.requestIdleCallback || function(fn) { setTimeout(fn, 3000); };
        w.addEventListener('load', function() { idle(loadWidget, { timeout: 6000 }); });
    })(document, window, 'BrevoConversations');
</script>
