server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long-lived, immutable filenames (Vite content-hashes them).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — matches vercel.json's "/(.*)" -> "/index.html" rewrite.
    location / {
        try_files $uri /index.html;
    }
}
